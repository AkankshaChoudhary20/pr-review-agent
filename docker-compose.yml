services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pr-reviewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_pr_reviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything here runs once against a fresh volume to set up the schema.
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_pr_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
